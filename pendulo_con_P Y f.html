<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Péndulo simple con medición de período y frecuencia</title>
<style>
  :root{
    --panel:#ffffff;
    --card:#f8fafc;
    --text:#111827;
    --muted:#64748b;
    --border:#d1d5db;
    --blue:#0ea5e9;
    --green:#0f8f83;
    --amber:#f59e0b;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:20px;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:var(--text);
  }
  .box{
    max-width:1000px;
    margin:0 auto;
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px;
    background:var(--card);
  }
  svg{
    display:block;
    width:100%;
    height:auto;
    background:var(--panel);
    border-radius:12px;
  }
  .measurements{
    display:grid;
    grid-template-columns:repeat(4,minmax(0,1fr));
    gap:10px;
    margin-top:12px;
  }
  .metric{
    background:white;
    border:1px solid var(--border);
    border-radius:12px;
    padding:10px;
    text-align:center;
  }
  .metric .label{
    display:block;
    color:var(--muted);
    font-size:13px;
    margin-bottom:4px;
  }
  .metric .value{
    font-size:20px;
    font-weight:700;
    color:var(--text);
  }
  .controls{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:14px;
  }
  .group{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:230px;
  }
  button{
    min-height:44px;
    padding:0 16px;
    border:1px solid var(--border);
    border-radius:10px;
    background:#ffffff;
    color:var(--text);
    font-weight:700;
    cursor:pointer;
  }
  button:hover{background:#f1f5f9}
  input[type=range]{width:150px}
  .status{
    text-align:center;
    margin-top:10px;
    font-weight:700;
  }
  .note{
    text-align:center;
    margin-top:6px;
    color:var(--muted);
    font-size:.92rem;
    line-height:1.4;
  }
  @media(max-width:700px){
    .measurements{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>
<div id="pendulo-medidor" class="box">

  <svg viewBox="0 0 820 560" role="img"
       aria-label="Péndulo simple con contador de oscilaciones, tiempo, período y frecuencia">

    <!-- soporte -->
    <rect x="325" y="42" width="170" height="24" rx="3" fill="#949ba3"/>
    <line x1="410" y1="66" x2="410" y2="82"
          stroke="#111827" stroke-width="4" stroke-linecap="round"/>
    <circle cx="410" cy="82" r="7" fill="#111827"/>

    <!-- trayectoria -->
    <path id="traj" d=""
          fill="none"
          stroke="#cbd5e1"
          stroke-width="3"
          stroke-dasharray="8 8"/>

    <!-- equilibrio -->
    <line id="eqLine"
          x1="410" y1="82"
          x2="410" y2="400"
          stroke="#94a3b8"
          stroke-width="2"
          stroke-dasharray="8 8"/>

    <!-- cuerda -->
    <line id="rope"
          x1="410" y1="82"
          x2="410" y2="400"
          stroke="#111827"
          stroke-width="4"
          stroke-linecap="round"/>

    <!-- masa -->
    <circle id="bob"
            cx="410" cy="400" r="27"
            fill="#32a9db"
            stroke="#0e7490"
            stroke-width="4"/>

    <circle id="shine"
            cx="400" cy="390" r="8"
            fill="#dff6ff"
            opacity=".9"/>

    <!-- velocidad tangencial -->
    <g id="velocity" opacity="0">
      <line id="vLine"
            x1="0" y1="0" x2="0" y2="0"
            stroke="#0f8f83"
            stroke-width="7"
            stroke-linecap="round"/>

      <polygon id="vHead"
               points="0,0 0,0 0,0"
               fill="#0f8f83"/>

      <text id="vText"
            x="0" y="0"
            font-size="23"
            font-weight="700"
            fill="#0f8f83">v</text>
    </g>

    <!-- indicador perpendicularidad -->
    <polyline id="angle90"
              points="0,0 0,0 0,0"
              fill="none"
              stroke="#f59e0b"
              stroke-width="3"
              opacity="0"/>

    <!-- etiquetas -->
    <text id="minusA"
          x="0" y="0"
          font-size="20"
          fill="#64748b"
          text-anchor="middle">−A</text>

    <text id="plusA"
          x="0" y="0"
          font-size="20"
          fill="#64748b"
          text-anchor="middle">+A</text>

    <text id="equilibriumText"
          x="410" y="0"
          font-size="20"
          fill="#64748b"
          text-anchor="middle">equilibrio</text>

    <text x="410" y="528"
          text-anchor="middle"
          font-size="16"
          fill="#64748b">
      La velocidad es tangente a la trayectoria y perpendicular a la cuerda.
    </text>
  </svg>

  <!-- mediciones -->
  <div class="measurements">
    <div class="metric">
      <span class="label">Tiempo transcurrido</span>
      <span class="value" id="timeValue">0.00 s</span>
    </div>

    <div class="metric">
      <span class="label">Oscilaciones completas</span>
      <span class="value" id="oscValue">0</span>
    </div>

    <div class="metric">
      <span class="label">Período medido T</span>
      <span class="value" id="periodValue">—</span>
    </div>

    <div class="metric">
      <span class="label">Frecuencia medida f</span>
      <span class="value" id="freqValue">—</span>
    </div>
  </div>

  <div class="controls">
    <button id="play" type="button">Pausar</button>
    <button id="reset" type="button">Reiniciar</button>

    <div class="group">
      <label for="amp"><strong>Amplitud:</strong></label>
      <input id="amp" type="range" min="5" max="40" step="1" value="30">
      <span id="ampVal">30°</span>
    </div>

    <div class="group">
      <label for="length"><strong>Longitud:</strong></label>
      <input id="length" type="range" min="1" max="3" step="0.1" value="2">
      <span id="lengthVal">2.0 m</span>
    </div>
  </div>

  <div id="status" class="status" aria-live="polite">
    −A · velocidad cero
  </div>
</div>

<script>
(()=>{
const root=document.getElementById('pendulo-medidor');
const g=9.81;
const pivot={x:410,y:82};

const traj=root.querySelector('#traj');
const eqLine=root.querySelector('#eqLine');
const rope=root.querySelector('#rope');
const bob=root.querySelector('#bob');
const shine=root.querySelector('#shine');

const velocity=root.querySelector('#velocity');
const vLine=root.querySelector('#vLine');
const vHead=root.querySelector('#vHead');
const vText=root.querySelector('#vText');
const angle90=root.querySelector('#angle90');

const minusA=root.querySelector('#minusA');
const plusA=root.querySelector('#plusA');
const equilibriumText=root.querySelector('#equilibriumText');

const play=root.querySelector('#play');
const reset=root.querySelector('#reset');
const amp=root.querySelector('#amp');
const length=root.querySelector('#length');
const ampVal=root.querySelector('#ampVal');
const lengthVal=root.querySelector('#lengthVal');
const status=root.querySelector('#status');

const timeValue=root.querySelector('#timeValue');
const oscValue=root.querySelector('#oscValue');
const periodValue=root.querySelector('#periodValue');
const freqValue=root.querySelector('#freqValue');

let running=true;
let theta=0;
let omega=0;
let previousOmega=0;
let simTime=0;
let oscillations=0;
let last=performance.now();

function parameters(){
  const thetaMax=Number(amp.value)*Math.PI/180;
  const Lm=Number(length.value);
  const Lpx=215+(Lm-1)*55;
  return {thetaMax,Lm,Lpx};
}

function position(th,Lpx){
  return {
    x:pivot.x+Lpx*Math.sin(th),
    y:pivot.y+Lpx*Math.cos(th)
  };
}

function rebuildGeometry(){
  const {thetaMax,Lpx}=parameters();

  const N=140;
  let d='';

  for(let i=0;i<=N;i++){
    const th=-thetaMax+(2*thetaMax*i/N);
    const p=position(th,Lpx);
    d+=(i===0?'M ':' L ')+p.x.toFixed(2)+' '+p.y.toFixed(2);
  }

  traj.setAttribute('d',d);

  const left=position(-thetaMax,Lpx);
  const right=position(thetaMax,Lpx);
  const eq=position(0,Lpx);

  eqLine.setAttribute('x2',eq.x);
  eqLine.setAttribute('y2',eq.y);

  minusA.setAttribute('x',left.x-8);
  minusA.setAttribute('y',left.y+38);

  plusA.setAttribute('x',right.x+8);
  plusA.setAttribute('y',right.y+38);

  equilibriumText.setAttribute('x',eq.x);
  equilibriumText.setAttribute('y',Math.min(492,eq.y+42));
}

function resetPhysics(){
  const {thetaMax}=parameters();

  theta=-thetaMax;
  omega=0;
  previousOmega=0;

  simTime=0;
  oscillations=0;

  rebuildGeometry();
  updateMeasurements();
  render();
}

function updateMeasurements(){
  timeValue.textContent=simTime.toFixed(2)+' s';
  oscValue.textContent=String(oscillations);

  if(oscillations>=1 && simTime>0){
    const measuredPeriod=simTime/oscillations;
    const measuredFrequency=oscillations/simTime;

    periodValue.textContent=measuredPeriod.toFixed(3)+' s';
    freqValue.textContent=measuredFrequency.toFixed(3)+' Hz';
  }else{
    periodValue.textContent='—';
    freqValue.textContent='—';
  }
}

function velocityArrow(p,th,w,Lm,thetaMax){
  const omegaMax=Math.sqrt((2*g/Lm)*(1-Math.cos(thetaMax)));
  const ratio=omegaMax>0 ? Math.min(1,Math.abs(w)/omegaMax) : 0;

  if(ratio<0.012){
    velocity.setAttribute('opacity','0');
    angle90.setAttribute('opacity','0');
    return;
  }

  velocity.setAttribute('opacity','1');
  angle90.setAttribute('opacity','1');

  const direction=w>=0 ? 1 : -1;

  // Tangente a la trayectoria
  const tx=Math.cos(th)*direction;
  const ty=-Math.sin(th)*direction;

  // Dirección radial/cuerda
  const rx=Math.sin(th);
  const ry=Math.cos(th);

  const offset=38;
  const arrowLength=30+105*ratio;

  const sx=p.x+tx*offset;
  const sy=p.y+ty*offset;
  const ex=sx+tx*arrowLength;
  const ey=sy+ty*arrowLength;

  vLine.setAttribute('x1',sx);
  vLine.setAttribute('y1',sy);
  vLine.setAttribute('x2',ex-tx*12);
  vLine.setAttribute('y2',ey-ty*12);

  const nx=-ty;
  const ny=tx;
  const h=10;

  vHead.setAttribute(
    'points',
    `${ex},${ey} `+
    `${ex-tx*18+nx*h},${ey-ty*18+ny*h} `+
    `${ex-tx*18-nx*h},${ey-ty*18-ny*h}`
  );

  vText.setAttribute('x',ex+tx*18);
  vText.setAttribute('y',ey+ty*18+7);

  const a={x:p.x+rx*15,y:p.y+ry*15};
  const b={x:a.x+tx*15,y:a.y+ty*15};
  const c={x:p.x+tx*15,y:p.y+ty*15};

  angle90.setAttribute(
    'points',
    `${a.x},${a.y} ${b.x},${b.y} ${c.x},${c.y}`
  );
}

function render(){
  const {thetaMax,Lm,Lpx}=parameters();
  const p=position(theta,Lpx);

  rope.setAttribute('x2',p.x);
  rope.setAttribute('y2',p.y);

  bob.setAttribute('cx',p.x);
  bob.setAttribute('cy',p.y);

  shine.setAttribute('cx',p.x-9);
  shine.setAttribute('cy',p.y-9);

  velocityArrow(p,theta,omega,Lm,thetaMax);

  const omegaMax=Math.sqrt((2*g/Lm)*(1-Math.cos(thetaMax)));
  const ratio=omegaMax>0 ? Math.abs(omega)/omegaMax : 0;

  if(ratio<0.012){
    status.textContent=theta<0
      ? '−A · velocidad cero'
      : '+A · velocidad cero';
  }else if(Math.abs(theta)<0.018){
    status.textContent='Equilibrio · rapidez máxima';
  }else{
    status.textContent=omega>0
      ? 'Movimiento hacia la derecha'
      : 'Movimiento hacia la izquierda';
  }
}

function integrate(dt){
  const {Lm}=parameters();

  const acc=th=>-(g/Lm)*Math.sin(th);

  const oldOmega=omega;

  // RK4
  const k1t=omega;
  const k1w=acc(theta);

  const k2t=omega+k1w*dt/2;
  const k2w=acc(theta+k1t*dt/2);

  const k3t=omega+k2w*dt/2;
  const k3w=acc(theta+k2t*dt/2);

  const k4t=omega+k3w*dt;
  const k4w=acc(theta+k3t*dt);

  theta+=(dt/6)*(k1t+2*k2t+2*k3t+k4t);
  omega+=(dt/6)*(k1w+2*k2w+2*k3w+k4w);

  simTime+=dt;

  // Una oscilación completa se cuenta cuando el péndulo
  // vuelve al extremo izquierdo:
  // omega cambia de negativo a positivo con theta < 0.
  if(oldOmega<0 && omega>=0 && theta<0){
    oscillations++;
  }

  previousOmega=omega;
}

function loop(now){
  if(running){
    const dt=Math.min(0.04,(now-last)/1000);

    const steps=Math.max(1,Math.ceil(dt/0.006));
    const h=dt/steps;

    for(let i=0;i<steps;i++){
      integrate(h);
    }

    render();
    updateMeasurements();
  }

  last=now;
  requestAnimationFrame(loop);
}

function syncControls(){
  ampVal.textContent=amp.value+'°';
  lengthVal.textContent=Number(length.value).toFixed(1)+' m';

  // Al cambiar los parámetros se inicia una nueva medición.
  resetPhysics();
}

play.addEventListener('click',()=>{
  running=!running;
  play.textContent=running ? 'Pausar' : 'Reproducir';
  last=performance.now();
});

reset.addEventListener('click',()=>{
  running=true;
  play.textContent='Pausar';
  resetPhysics();
  last=performance.now();
});

amp.addEventListener('input',syncControls);
length.addEventListener('input',syncControls);

if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches){
  running=false;
  play.textContent='Reproducir';
}

syncControls();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
