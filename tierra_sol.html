<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tierra alrededor del Sol — con punto de referencia</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    padding:18px;
    background:#050b14;
    font-family:Arial,Helvetica,sans-serif;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
  }
  .card{
    background:#091426;
    border:1px solid #24364f;
    border-radius:18px;
    padding:14px;
  }
  svg{
    width:100%;
    height:auto;
    display:block;
    border-radius:14px;
    background:
      radial-gradient(circle at center, rgba(11,31,58,.65), rgba(4,10,19,.98));
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <svg id="scene" viewBox="0 0 1000 620" role="img"
         aria-label="La Tierra gira alrededor del Sol en sentido antihorario y rota sobre su propio eje">

      <!-- estrellas -->
      <g id="stars" opacity=".8"></g>

      <!-- órbita completa -->
      <ellipse cx="470" cy="310" rx="350" ry="205"
               fill="none"
               stroke="#8bb3df"
               stroke-width="3"
               stroke-dasharray="10 9"
               opacity=".82"/>

      <!-- punto fijo de referencia: posición inicial -->
      <g id="startReference">
        <circle cx="820" cy="310" r="11"
                fill="none"
                stroke="#facc15"
                stroke-width="3"
                opacity=".95"/>
        <circle cx="820" cy="310" r="5"
                fill="#facc15"/>
        <text x="820" y="285"
              text-anchor="middle"
              fill="#fde68a"
              font-size="18"
              font-weight="700">Inicio</text>
      </g>

      <defs>
        <radialGradient id="sunGlow">
          <stop offset="0%" stop-color="#fff4a8"/>
          <stop offset="45%" stop-color="#fbbf24"/>
          <stop offset="100%" stop-color="#f97316"/>
        </radialGradient>

        <radialGradient id="earthOcean">
          <stop offset="0%" stop-color="#7dd3fc"/>
          <stop offset="100%" stop-color="#0369a1"/>
        </radialGradient>

        <clipPath id="earthClip">
          <circle cx="0" cy="0" r="28"/>
        </clipPath>
      </defs>

      <!-- Sol -->
      <circle cx="470" cy="310" r="58" fill="url(#sunGlow)"/>
      <circle cx="470" cy="310" r="78"
              fill="none"
              stroke="#f59e0b"
              stroke-width="8"
              opacity=".12"/>

      <text x="470" y="392"
            text-anchor="middle"
            fill="#fde68a"
            font-size="24"
            font-weight="700">Sol</text>

      <!-- Tierra -->
      <g id="earthGroup">
        <circle cx="0" cy="0" r="28"
                fill="url(#earthOcean)"
                stroke="#bae6fd"
                stroke-width="2"/>

        <g id="continents" clip-path="url(#earthClip)">
          <path d="M -17 -11
                   C -7 -22, 6 -16, 10 -9
                   C 15 -2, 8 5, 2 6
                   C -3 7, -5 14, -13 12
                   C -17 7, -23 0, -17 -11 Z"
                fill="#4ade80"/>

          <path d="M 6 7
                   C 13 5, 20 9, 18 15
                   C 15 21, 7 23, 1 18
                   C -3 14, 0 10, 6 7 Z"
                fill="#22c55e"/>
        </g>

        <!-- eje terrestre -->
        <line x1="-13" y1="30"
              x2="13" y2="-30"
              stroke="#f8fafc"
              stroke-width="3"
              stroke-linecap="round"/>

        <text x="0" y="55"
              text-anchor="middle"
              fill="#f8fafc"
              font-size="20"
              font-weight="700">Tierra</text>
      </g>
    </svg>
  </div>
</div>

<script>
(()=>{
  const earthGroup = document.getElementById('earthGroup');
  const continents = document.getElementById('continents');
  const stars = document.getElementById('stars');

  // Estrellas
  let starMarkup = '';
  for(let i=0;i<90;i++){
    const x = (31*i*19)%980 + 10;
    const y = (47*i*13)%590 + 10;
    const r = 0.7 + (i%3)*0.45;
    starMarkup += `<circle cx="${x}" cy="${y}" r="${r}" fill="#dbeafe" opacity="${0.25+(i%5)*0.1}"/>`;
  }
  stars.innerHTML = starMarkup;

  // Parámetros de la órbita
  const cx = 470;
  const cy = 310;
  const rx = 350;
  const ry = 205;

  // Una vuelta completa en 12 segundos
  const orbitPeriod = 12;

  // Rotaciones visibles de la Tierra durante una vuelta
  const visibleRotations = 10;

  let elapsed = 0;
  let last = performance.now();

  function render(){
    const theta = 2*Math.PI*(elapsed/orbitPeriod);

    // Traslación antihoraria vista desde el polo norte
    const x = cx + rx*Math.cos(theta);
    const y = cy - ry*Math.sin(theta);

    earthGroup.setAttribute(
      'transform',
      `translate(${x.toFixed(2)} ${y.toFixed(2)})`
    );

    // Rotación terrestre sobre su propio eje
    const spinDeg = -(elapsed/orbitPeriod)*visibleRotations*360;
    continents.setAttribute(
      'transform',
      `rotate(${spinDeg.toFixed(2)} 0 0)`
    );
  }

  function loop(now){
    elapsed += (now-last)/1000;
    last = now;
    render();
    requestAnimationFrame(loop);
  }

  render();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
