name: Restaurar Video Project 7
on:
  push:
    branches:
      - main
    paths:
      - 'video_upload_parts/**'
permissions:
  contents: write
jobs:
  ensamblar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unir fragmentos y verificar integridad
        shell: bash
        run: |
          set -euo pipefail
          cat video_upload_parts/chunk_*.bin > video_project_7.mp4
          printf '%s  %s\n' '56d3e8453725caf33cdae13c03ad76f114e37dbef7b1f9e5c581de979ec84aac' 'video_project_7.mp4' | sha256sum -c -
          rm -rf video_upload_parts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Actualizar video_project_7.mp4 con el MP4 original'
          git push origin HEAD:main
